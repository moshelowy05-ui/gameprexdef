version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gameprex
      POSTGRES_PASSWORD: gameprex_dev
      POSTGRES_DB: gameprexdef
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gameprex -d gameprexdef"]
      interval: 5s
      timeout: 5s
      retries: 10

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: gameprex
      POSTGRES_PASSWORD: gameprex_dev
      POSTGRES_DB: gameprex_events
    ports:
      - "5433:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gameprex -d gameprex_events"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot service: runs migrations + seed, then exits.
  # The api service waits for this to complete before starting.
  init-db:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://gameprex:gameprex_dev@postgres:5432/gameprexdef
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./db:/db
    working_dir: /db
    entrypoint: >
      sh -c "
        pip install asyncpg --quiet &&
        alembic upgrade head &&
        DATABASE_URL=postgresql://gameprex:gameprex_dev@postgres:5432/gameprexdef
        python seeds/seed_platforms.py &&
        echo 'DB init complete'
      "
    restart: "no"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://gameprex:gameprex_dev@postgres:5432/gameprexdef
      EVENTS_DATABASE_URL: postgresql+asyncpg://gameprex:gameprex_dev@timescaledb:5432/gameprex_events
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-key-change-in-production
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      init-db:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app
      - ./scenarios:/scenarios
    command: uvicorn api.main:application --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_WS_URL: ws://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
  timescale_data:
  redis_data:
